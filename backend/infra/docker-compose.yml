version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: newstrust_postgres
    environment:
      POSTGRES_USER: newstrust
      POSTGRES_PASSWORD: devpassword2026
      POSTGRES_DB: newstrust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newstrust"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: newstrust_redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: newstrust_api
    environment:
      - DATABASE_URL=postgresql://newstrust:devpassword2026@postgres:5432/newstrust
      - PYTHONIOENCODING=utf-8
      - PILOT_COUNTRIES=NP,US,CA
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: newstrust_web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
